name: windows-tool

on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/windows-tool.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyserial pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name MatrixPicoConsole tools/matrixpico_console.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixPicoConsole-exe
          path: dist/MatrixPicoConsole.exe
          if-no-files-found: error

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tool-latest
          name: Matrix Pico Console
          body: >
            Serial console tool for tuning the Matrix Pico glitcher.
            Auto-detects the Pico's COM port. Unsigned, so Windows SmartScreen
            will warn on first run - click "More info" then "Run anyway".
          files: dist/MatrixPicoConsole.exe
