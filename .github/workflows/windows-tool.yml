name: windows-tool

on:
  push:
    paths:
      - 'tools/**'
      - '*.c'
      - '*.pio'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-tool.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Bundle the exact per-board firmware binaries that were hardware-tested (firmware/<board>.uf2),
      # NOT a fresh CI compile: a different toolchain produced different code and
      # different boot behaviour on the console.
      - name: Use the hardware-validated firmware
        shell: bash
        run: |
          mkdir -p tools/assets/firmware
          cp firmware/*.uf2 tools/assets/firmware/
          ls -l tools/assets/firmware

      - name: Install deps
        run: pip install pyserial pillow pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name MatrixPicoConsole --paths tools --add-data "tools/assets/bg.png;assets" --add-data "tools/assets/Inter-ExtraBoldItalic.otf;assets" --add-data "tools/assets/firmware;assets/firmware" tools/matrixpico_console.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixPicoConsole-exe
          path: dist/MatrixPicoConsole.exe
          if-no-files-found: error

      # main -> the real release; any other branch -> a separate test release so a
      # branch build can never overwrite the exe people are using.
      - name: Publish to release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tool-latest
          name: Matrix Pico Console
          body: >
            Serial console tool for tuning the Matrix Pico glitcher. Flashes a
            blank Pico for you (FLASH PICO). Unsigned, so Windows SmartScreen
            will warn on first run - click "More info" then "Run anyway".
          files: dist/MatrixPicoConsole.exe

      - name: Publish to test release (branches)
        if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tool-test
          name: Matrix Pico Console (test build)
          body: Branch test build - not the release.
          prerelease: true
          files: dist/MatrixPicoConsole.exe
